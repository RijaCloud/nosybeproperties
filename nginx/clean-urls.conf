# Include inside the existing server {} block, replacing location /.
# The server root must point to the directory containing index.html.

# Check the original request to avoid loops during internal file resolution.
if ($request_uri ~ "^/index(?:\.html)?(?:\?|$)") {
    return 301 /$is_args$args;
}

if ($request_uri ~ "^(?<clean_page>/[^?]+)\.html(?:\?|$)") {
    return 301 $clean_page$is_args$args;
}

location = / {
    try_files /index.html =404;
}

location / {
    # Prefer pages over same-name directories such as /agent and /blog.
    try_files $uri.html $uri =404;
}
